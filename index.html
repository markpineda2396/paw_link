<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="PawLink connects communities to help lost pets reunite with their families and find loving homes.">
  <title>PawLink | Find your way home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container landing-container">
    <section class="hero" aria-label="Welcome to PawLink">
      <div class="hero-image" role="img" aria-label="Happy dog enjoying time outdoors"></div>
      <div class="hero-shade"></div>
      <div class="brand brand-on-hero">
        <i class="fa-solid fa-paw" aria-hidden="true"></i>
        <span>PawLink</span>
      </div>
      <svg class="hero-wave" viewBox="0 0 414 90" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,40 C94,92 250,94 414,20 L414,90 L0,90 Z" fill="#f8fafc"></path>
      </svg>
    </section>

    <section class="landing-content">
      <div class="welcome-mark" aria-hidden="true"><i class="fa-solid fa-paw"></i></div>
      <p class="eyebrow">A little help goes a long way</p>
      <h1>Report. Search.<br>Reunite. Adopt.</h1>
      <p class="landing-subtitle">A community-based platform for lost pets, found pets, and adoption opportunities</p>
      <div class="landing-actions">
        <a class="button button-primary" href="register.html">Get Started <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
        <a class="button button-outline" href="login.html">Log In</a>
      </div>
      <p class="community-note"><i class="fa-solid fa-heart" aria-hidden="true"></i> Together, every pet can find their way home.</p>
    </section>
  </main>
</body>
</html>
