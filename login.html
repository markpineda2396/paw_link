<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log In | PawLink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dashboard.css"><script defer src="pawlink.js"></script></head><body><main class="container login-container"><a class="brand login-brand" href="index.html"><i class="fa-solid fa-paw"></i><span>PawLink</span></a><section class="login-content"><div class="login-heading"><h1>Welcome back</h1><p>Log in to your PawLink demo profile.</p></div><form class="login-form" id="login-form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="login-message" class="form-note" role="status"></p><button class="button button-primary submit-button" type="submit">Log in</button></form><p class="signup-prompt">New to PawLink? <a class="text-link" href="register.html">Create an account</a></p><p class="demo-note">Demo login checks the profile saved in this browser; it is not secure authentication.</p></section></main></body></html>
