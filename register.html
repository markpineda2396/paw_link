<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create an Account | PawLink</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dashboard.css"><script defer src="pawlink.js"></script></head><body><main class="container register-container"><a class="brand register-brand" href="index.html"><i class="fa-solid fa-paw"></i><span>PawLink</span></a><section class="register-content"><div class="register-heading"><p class="eyebrow">Join the PawLink community</p><h1>Create your account</h1><p>Demo details sync with your PawLink profile in this browser.</p></div><form class="register-form" id="register-form"><div class="form-field"><label for="full-name">Full name</label><input id="full-name" name="name" autocomplete="name" required></div><div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div><div class="form-field"><label for="age">Age</label><input id="age" name="age" type="number" min="13" max="120"></div><div class="form-field"><label for="city">City or area</label><input id="city" name="city" autocomplete="address-level2"></div><div class="form-field"><label for="interest">I'm here to</label><select id="interest" name="interest"><option>Adoption</option><option>Lost and found pets</option><option>Helping my community</option></select></div><div class="form-field form-field-full"><label for="password">Create password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><button class="button button-primary submit-button form-field-full" type="submit">Continue to preferences</button></form><p class="signup-prompt">Already have an account? <a class="text-link" href="login.html">Log in</a></p><p class="privacy-note">Demo profile information is stored in this browser only.</p></section></main></body></html>
